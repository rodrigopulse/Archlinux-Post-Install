# Alacritty Configuration File - TOML, One Dark Pro + JetBrains Mono

[font]
normal.family = "JetBrains Mono"
normal.style = "Regular"
bold.family = "JetBrains Mono"
bold.style = "Bold"
italic.family = "JetBrains Mono"
italic.style = "Italic"
bold_italic.family = "JetBrains Mono"
bold_italic.style = "Bold Italic"
size = 13.0

[window]
dimensions.columns = 120
dimensions.lines = 30
padding.x = 10
padding.y = 10
decorations = "full"
dynamic_title = true
opacity = 0.9
startup_mode = "Windowed"

[colors.primary]
background = "0x1e1e1e"
foreground = "0xabb2bf"

[colors.normal]
black = "0x1e1e1e"
red = "0xe06c75"
green = "0x98c379"
yellow = "0xe5c07b"
blue = "0x61afef"
magenta = "0xc678dd"
cyan = "0x56b6c2"
white = "0xdcdfe4"

[colors.bright]
black = "0x4b4b4b"
red = "0xe06c75"
green = "0x98c379"
yellow = "0xe5c07b"
blue = "0x61afef"
magenta = "0xc678dd"
cyan = "0x56b6c2"
white = "0xffffff"

[scrolling]
history = 10000
multiplier = 3
